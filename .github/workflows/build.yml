name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
          - target: linux
            os: ubuntu-latest
            command: flutter build linux --release
            artifact: build/linux/x64/release/bundle
          - target: windows
            os: windows-latest
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - target: macos
            os: macos-latest
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release/opack.app
          - target: ios
            os: macos-latest
            # Unsigned until Apple certificates are added as secrets.
            command: flutter build ios --release --no-codesign
            artifact: build/ios/iphoneos/Runner.app
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: opack-${{ matrix.target }}
          path: ${{ matrix.artifact }}
